name: daily-refresh

on:
  schedule:
    # 21:30 UTC on weekdays, after the US close in both daylight and standard time
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Refresh results
        run: python -m quanter.pipeline

      - name: Commit changes
        run: |
          git config user.name "quanter-bot"
          git config user.email "quanter-bot@users.noreply.github.com"
          git add site_data/results.json site_data/paper_log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
